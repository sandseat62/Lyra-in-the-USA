<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyra's AI-Powered Detroit Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Pacifico&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            overflow-y: auto;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
            background-size: cover;
            background-position: center;
        }

        .slide.active {
            display: flex;
            opacity: 1;
        }

        .fun-font {
            font-family: 'Pacifico', cursive;
        }

        .glass {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            max-width: 1000px;
        }

        .btn-hover:hover {
            transform: scale(1.05);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Fixed Navigation */
        .nav-controls {
            position: fixed;
            bottom: 2rem;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }
        
        .nav-controls button {
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-blue-50 h-screen w-screen">

    <!-- Settings Button (Top Left) -->
    <div class="fixed top-6 left-6 z-[110]">
        <button onclick="toggleSettings()" class="bg-white/80 hover:bg-white p-3 rounded-full shadow-lg border border-gray-200 transition-all">
            ⚙️
        </button>
    </div>

    <!-- API Key Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-[140] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="glass max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold mb-4">Settings</h2>
            <p class="text-sm text-gray-600 mb-4">Inside the chat, AI features work automatically. In a live browser, you need to add your own Gemini API key to use the "Magic Detailer".</p>
            <input id="user-api-key" type="password" placeholder="Enter Gemini API Key..." class="w-full p-3 rounded-xl border border-gray-200 mb-4 focus:ring-2 focus:ring-blue-400 outline-none">
            <div class="flex justify-end space-x-2">
                <button onclick="toggleSettings()" class="px-4 py-2 text-gray-500 font-bold">Cancel</button>
                <button onclick="saveApiKey()" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold">Save Key</button>
            </div>
        </div>
    </div>

    <!-- Main Presentation Container -->
    <div id="slides-container" class="relative w-full h-full">
        <!-- Slides will be injected here -->
    </div>

    <!-- Navigation Control -->
    <div class="nav-controls">
        <div id="slide-indicator" class="mb-3 bg-white/90 px-4 py-1 rounded-full text-xs font-bold text-gray-500 shadow-sm border border-white">
            Loading Adventure...
        </div>
        <div class="flex space-x-4">
            <button onclick="prevSlide()" class="bg-blue-600 text-white px-8 py-3 rounded-full shadow-lg btn-hover font-bold border-2 border-blue-400 transition-all active:scale-95">← Back</button>
            <button onclick="nextSlide()" class="bg-blue-600 text-white px-8 py-3 rounded-full shadow-lg btn-hover font-bold border-2 border-blue-400 transition-all active:scale-95">Next Day →</button>
        </div>
    </div>

    <!-- AI Result Modal -->
    <div id="ai-response-modal" class="fixed inset-0 z-[130] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="glass max-w-2xl rounded-3xl p-8 shadow-2xl max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 id="ai-title" class="text-3xl font-black text-indigo-800">✨ AI Insight</h3>
                <button onclick="closeAIResponse()" class="text-gray-400 hover:text-black text-2xl font-bold">✕</button>
            </div>
            <div id="ai-content" class="text-lg text-gray-700 leading-relaxed"></div>
            <div class="mt-8 pt-6 border-t border-gray-100 flex justify-end">
                <button onclick="closeAIResponse()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold">Got it!</button>
            </div>
        </div>
    </div>

    <script>
        // API key handling: use provided key or check local storage
        let apiKey = "" || localStorage.getItem('lyra_trip_api_key');
        
        const themeMap = {
            indigo: { border: 'border-indigo-600', text: 'text-indigo-600', bg: 'bg-indigo-50' },
            orange: { border: 'border-orange-600', text: 'text-orange-600', bg: 'bg-orange-50' },
            teal: { border: 'border-teal-600', text: 'text-teal-600', bg: 'bg-teal-50' },
            pink: { border: 'border-pink-600', text: 'text-pink-600', bg: 'bg-pink-50' },
            red: { border: 'border-red-600', text: 'text-red-600', bg: 'bg-red-50' },
            cyan: { border: 'border-cyan-600', text: 'text-cyan-600', bg: 'bg-cyan-50' },
            yellow: { border: 'border-yellow-600', text: 'text-yellow-600', bg: 'bg-yellow-50' },
            blue: { border: 'border-blue-600', text: 'text-blue-600', bg: 'bg-blue-50' }
        };

        const tripData = [
            {
                date: "Thursday, April 2",
                title: "Detroit Vertical & Victory",
                bg: "https://images.unsplash.com/photo-1569331527318-912c324df1bc?auto=format&fit=crop&q=80&w=1200",
                theme: "indigo",
                activities: ["🕒 9:00 AM: DYNO Detroit Climbing", "🕒 4:00 PM: The Yard at Corktown", "🕒 7:00 PM: Pistons vs Timberwolves"],
                gf: "Breakfast: Seven Elements | Lunch: Breadless | Dinner: Mercury Burger"
            },
            {
                date: "Friday, April 3",
                title: "Opening Day Buzz",
                bg: "https://images.unsplash.com/photo-1508344928928-7165b67de128?auto=format&fit=crop&q=80&w=1200",
                theme: "orange",
                activities: ["🕒 1:10 PM: Tigers Opening Day vs. Cardinals", "🕒 Post-Game: Friday Night Fireworks!"],
                gf: "Breakfast: Hudson Cafe | Lunch: JoJo’s ShakeBAR | Dinner: Union Assembly"
            },
            {
                date: "Saturday, April 4",
                title: "Windsor Wave & Win",
                bg: "https://images.unsplash.com/photo-1540541338287-41700207dee6?auto=format&fit=crop&q=80&w=1200",
                theme: "teal",
                activities: ["🕒 10:00 AM: Adventure Bay Water Park", "🕒 3:00 PM: Big Time Entertainment (Karts & Laser Tag)"],
                gf: "Breakfast: Germack Roasting | Lunch: Supino Pizzeria | Dinner: Big Time Eats"
            },
            {
                date: "Sunday, April 5",
                title: "Easter Bunny Hop",
                bg: "https://images.unsplash.com/photo-1522336572018-ed994602f30b?auto=format&fit=crop&q=80&w=1200",
                theme: "pink",
                activities: ["🕒 11:00 AM: Easter Brunch @ JoJo's", "🕒 7:20 PM: Tigers Kids Day (Ferris Wheel)"],
                gf: "Brunch: JoJo's | Lunch: Anna's House | Dinner: Comerica Park GF Stand"
            },
            {
                date: "Monday, April 6",
                title: "Gravity & Cinema",
                bg: "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&q=80&w=1200",
                theme: "indigo",
                activities: ["🕒 1:00 PM: Slick City Action Park", "🕒 6:30 PM: 'Hoppers' Movie @ Emagine"],
                gf: "Breakfast: Toasted Oak | Lunch: Playa Bowls | Dinner: Condado Tacos"
            },
            {
                date: "Tuesday, April 7",
                title: "The Big Bargain Day",
                bg: "https://images.unsplash.com/photo-1559599101-f09722fb4948?auto=format&fit=crop&q=80&w=1200",
                theme: "red",
                activities: ["🕒 1:00 PM: $5 Movie Matinee", "🕒 6:40 PM: 313 Value Game (Tigers)"],
                gf: "Breakfast: First Watch | Lunch: Shake Shack (GF) | Dinner: Value Hot Dogs"
            },
            {
                date: "Wednesday, April 8",
                title: "Creative Competition",
                bg: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&q=80&w=1200",
                theme: "cyan",
                activities: ["🕒 10:00 AM: 2D DIY Studio", "🕒 3:00 PM: Pickleball @ SPARC Novi"],
                gf: "Breakfast: Anna's House | Lunch: Playa Bowls | Dinner: Merri Bowl"
            },
            {
                date: "Thursday, April 9",
                title: "Style & Strike",
                bg: "https://images.unsplash.com/photo-1519340333755-968054813588?auto=format&fit=crop&q=80&w=1200",
                theme: "yellow",
                activities: ["🕒 1:00 PM: Somerset Collection Shopping", "🕒 7:00 PM: Night Strike @ Merri Bowl"],
                gf: "Breakfast: Thyme Kitchen | Lunch: The Loose Goose | Dinner: Union Assembly"
            },
            {
                date: "Friday, April 10",
                title: "Underwater Finale",
                bg: "https://images.unsplash.com/photo-1540331547168-8b63109225b7?auto=format&fit=crop&q=80&w=1200",
                theme: "blue",
                activities: ["🕒 10:00 AM: SEA LIFE Aquarium", "🕒 6:45 PM: Party in the Park + Fireworks"],
                gf: "Breakfast: Rainforest Cafe | Lunch: Rise Pies | Dinner: Union Assembly"
            }
        ];

        let currentSlide = 0;
        const totalSlides = tripData.length + 1;

        function initSlides() {
            const container = document.getElementById('slides-container');
            
            // Intro Slide with ICONIC Detroit Skyline Background (Verified RenCen view)
            const intro = document.createElement('div');
            intro.id = 'slide-0';
            intro.className = 'slide active text-white text-center';
            // Using a verified Detroit skyline ID: photo-1555448248-2571daf6344b
            intro.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1555448248-2571daf6344b?auto=format&fit=crop&q=80&w=1200')`;
            intro.innerHTML = `
                <div class="max-w-4xl px-6">
                    <h1 class="text-7xl fun-font mb-6 drop-shadow-xl text-white">Hi Lyra!</h1>
                    <p class="text-3xl mb-10 font-light opacity-90 text-white">Your Detroit & Windsor 2026 Adventure</p>
                    <div class="flex flex-col items-center space-y-8">
                        <div class="flex justify-center space-x-12 text-2xl font-bold bg-white/10 p-6 rounded-3xl backdrop-blur-md">
                            <div class="flex flex-col text-white"><span>🏙️</span><span class="text-xs mt-1 uppercase tracking-widest">Detroit</span></div>
                            <div class="flex flex-col text-white"><span>🌉</span><span class="text-xs mt-1 uppercase tracking-widest">Windsor</span></div>
                            <div class="flex flex-col text-white"><span>🍕</span><span class="text-xs mt-1 uppercase tracking-widest">100% GF</span></div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(intro);

            // Daily Slides
            tripData.forEach((day, i) => {
                const colors = themeMap[day.theme] || themeMap.indigo;
                const slide = document.createElement('div');
                slide.id = `slide-${i + 1}`;
                slide.className = 'slide';
                slide.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('${day.bg}')`;
                
                slide.innerHTML = `
                    <div class="glass rounded-3xl p-8 md:p-12 shadow-2xl border-l-[12px] ${colors.border}">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h2 class="font-black uppercase tracking-widest ${colors.text} text-xl">${day.date}</h2>
                                <h1 class="text-4xl md:text-6xl font-black text-gray-900">${day.title}</h1>
                            </div>
                        </div>
                        <div class="grid md:grid-cols-2 gap-10">
                            <div>
                                <div class="flex items-center justify-between mb-5">
                                    <h3 class="text-2xl font-bold text-gray-800">The Action Plan</h3>
                                    <button onclick="getMagicDetail(${i})" class="text-sm font-bold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-full border border-indigo-200 hover:bg-indigo-100 transition-all">✨ Magic Detailer</button>
                                </div>
                                <ul class="space-y-4">
                                    ${day.activities.map(act => `<li class="flex items-center text-lg text-gray-700 font-medium"><span class="w-2 h-2 rounded-full mr-3" style="background-color: currentColor"></span>${act}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="p-8 rounded-3xl border ${colors.bg}" style="border-width: 1px; border-color: rgba(0,0,0,0.05)">
                                <div class="flex items-center justify-between mb-5">
                                    <h3 class="text-2xl font-bold text-gray-800">GF Fuel</h3>
                                    <button onclick="getMealRec(${i})" class="text-sm font-bold text-green-700 bg-green-50 px-4 py-2 rounded-full border border-green-200 hover:bg-green-100 transition-all">✨ Menu Scout</button>
                                </div>
                                <p class="text-xl text-gray-700 leading-relaxed font-semibold italic">"${day.gf}"</p>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(slide);
            });
            updateIndicator();
        }

        function showSlide(index) {
            if (index < 0) index = totalSlides - 1;
            if (index >= totalSlides) index = 0;

            const allSlides = document.querySelectorAll('.slide');
            allSlides.forEach(s => s.classList.remove('active'));
            
            const target = document.getElementById(`slide-${index}`);
            if (target) {
                target.classList.add('active');
                currentSlide = index;
                updateIndicator();
            }
        }

        function nextSlide() { showSlide(currentSlide + 1); }
        function prevSlide() { showSlide(currentSlide - 1); }

        function updateIndicator() {
            const indicator = document.getElementById('slide-indicator');
            if (indicator) {
                indicator.innerText = `Slide ${currentSlide + 1} of ${totalSlides}`;
            }
        }

        // --- GEMINI POWER ---

        async function callGemini(prompt, system) {
            // Priority: internal platform key -> manual key in code -> local storage key
            const finalKey = apiKey || localStorage.getItem('lyra_trip_api_key');
            
            if (!finalKey) {
                return "Lyra, to use this feature outside the chat, please click the ⚙️ gear icon and enter an API key!";
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${finalKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: system || "Expert guide for a 11-year-old traveler named Lyra." }] }
            };

            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, { 
                        method: 'POST', 
                        body: JSON.stringify(payload), 
                        headers: { 'Content-Type': 'application/json' } 
                    });
                    
                    if (!response.ok) throw new Error("API Request Failed");

                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "Oops, I couldn't find that detail.";
                } catch (e) { 
                    if (i === 4) return "Connection error. Please check your API key and internet!";
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        async function getMagicDetail(idx) {
            const modal = document.getElementById('ai-response-modal');
            const content = document.getElementById('ai-content');
            document.getElementById('ai-title').innerText = "✨ Magic Detail Finder";
            content.innerHTML = `<div class="p-10 text-center"><div class="loader"></div><p class="mt-4 font-bold text-indigo-600">Digging for hidden gems...</p></div>`;
            modal.classList.remove('hidden');

            const result = await callGemini(`Give me one cool secret for Lyra (age 11) about these: ${tripData[idx].activities.join(', ')}.`, "Fun, high-energy travel expert.");
            content.innerHTML = `<div class="bg-indigo-50 p-6 rounded-2xl border-2 border-indigo-100 text-xl font-medium text-gray-800">${result}</div>`;
        }

        async function getMealRec(idx) {
            const modal = document.getElementById('ai-response-modal');
            const content = document.getElementById('ai-content');
            document.getElementById('ai-title').innerText = "🍕 GF Menu Scout";
            content.innerHTML = `<div class="p-10 text-center"><div class="loader"></div><p class="mt-4 font-bold text-green-600">Finding GF yummy things...</p></div>`;
            modal.classList.remove('hidden');

            const result = await callGemini(`Best GF dish at: ${tripData[idx].gf} for Lyra.`, "Gluten-Free foodie expert.");
            content.innerHTML = `<div class="bg-green-50 p-6 rounded-2xl border-2 border-green-100 text-xl font-medium text-gray-800">${result}</div>`;
        }

        function closeAIResponse() { document.getElementById('ai-response-modal').classList.add('hidden'); }

        // Settings Logic
        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('user-api-key').value;
            if (key) {
                localStorage.setItem('lyra_trip_api_key', key);
                apiKey = key;
                alert("Key saved! Try the Magic Detailer now.");
                toggleSettings();
            }
        }

        // Run it
        window.onload = initSlides;
    </script>
</body>
</html>
