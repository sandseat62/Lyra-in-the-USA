<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyra's AI-Powered Detroit Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Pacifico&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: #f0f4f8;
            overflow: hidden;
        }

        .slide {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            width: 100%;
            height: 100%;
        }

        .slide.active {
            display: flex;
            opacity: 1;
        }

        .fun-font {
            font-family: 'Pacifico', cursive;
        }

        .glass {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-hover:hover {
            transform: scale(1.05);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Ensure dynamic content is visible */
        #dynamic-slides-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-blue-50 h-screen w-screen overflow-hidden">

    <!-- AI Assistant Button -->
    <div class="fixed top-6 right-6 z-50">
        <button onclick="toggleAIChat()" class="bg-indigo-600 text-white px-5 py-3 rounded-full shadow-2xl btn-hover flex items-center space-x-2 border-2 border-indigo-400">
            <span>✨ Ask Detroit Expert</span>
        </button>
    </div>

    <!-- AI Chat Modal -->
    <div id="ai-chat" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="glass w-full max-w-lg rounded-3xl p-6 shadow-2xl relative">
            <button onclick="toggleAIChat()" class="absolute top-4 right-4 text-gray-400 hover:text-black text-2xl font-bold">✕</button>
            <h2 class="text-2xl font-bold mb-4 flex items-center text-indigo-700">
                <span class="mr-2">✨</span> Detroit Expert
            </h2>
            <div id="chat-history" class="h-64 overflow-y-auto mb-4 space-y-3 p-4 bg-white/50 rounded-2xl border border-indigo-50">
                <p class="text-sm italic text-gray-500">Hi Lyra! I'm your AI guide for Detroit and Windsor. Ask me about the cool things we are going to do!</p>
            </div>
            <div class="flex space-x-2">
                <input id="chat-input" type="text" placeholder="Tell me a fun fact about tigers!" class="flex-1 p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-indigo-400 outline-none">
                <button onclick="sendChatMessage()" class="bg-indigo-600 text-white px-5 py-3 rounded-xl hover:bg-indigo-700">Send</button>
            </div>
        </div>
    </div>

    <!-- Navigation Control -->
    <div class="fixed bottom-8 left-0 right-0 z-50 flex flex-col items-center">
        <div id="slide-indicator" class="mb-3 bg-white/90 px-4 py-1 rounded-full text-xs font-bold text-gray-500 shadow-sm border border-white">
            Slide 1 of 10
        </div>
        <div class="flex space-x-4">
            <button onclick="prevSlide()" class="bg-blue-600 text-white px-8 py-3 rounded-full shadow-lg btn-hover font-bold border-2 border-blue-400 transition-all active:scale-95">← Back</button>
            <button onclick="nextSlide()" class="bg-blue-600 text-white px-8 py-3 rounded-full shadow-lg btn-hover font-bold border-2 border-blue-400 transition-all active:scale-95">Next Day →</button>
        </div>
    </div>

    <!-- Main Presentation Wrapper -->
    <div id="slides-wrapper" class="h-full w-full relative">
        
        <!-- Intro Slide (Slide 0) -->
        <div id="slide-0" class="slide active flex flex-col items-center justify-center bg-gradient-to-br from-blue-700 to-indigo-900 text-white text-center p-6">
            <div class="max-w-4xl">
                <h1 class="text-7xl fun-font mb-6 drop-shadow-xl">Hi Lyra!</h1>
                <p class="text-3xl mb-10 font-light opacity-90">Are you ready for your 2026 Adventure?</p>
                <div class="flex flex-col items-center space-y-8">
                    <div class="flex justify-center space-x-12 text-2xl font-bold bg-white/10 p-6 rounded-3xl backdrop-blur-md">
                        <div class="flex flex-col"><span>🏙️</span><span class="text-sm mt-1 uppercase tracking-tighter">Detroit</span></div>
                        <div class="flex flex-col"><span>🌉</span><span class="text-sm mt-1 uppercase tracking-tighter">Windsor</span></div>
                        <div class="flex flex-col"><span>🍕</span><span class="text-sm mt-1 uppercase tracking-tighter">100% GF</span></div>
                    </div>
                    <button onclick="speakIntro()" class="bg-white text-indigo-900 px-8 py-4 rounded-full font-black shadow-xl hover:bg-blue-50 transition-all flex items-center space-x-3 btn-hover">
                        <span>🔊 Play Voice Tour</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- This container will hold Slides 1-9 -->
        <div id="dynamic-slides-container" class="h-full w-full"></div>
    </div>

    <!-- AI Magic Result Modal -->
    <div id="ai-response-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="glass w-full max-w-2xl rounded-3xl p-8 shadow-2xl max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 id="ai-title" class="text-3xl font-black text-indigo-800">✨ AI Insight</h3>
                <button onclick="closeAIResponse()" class="text-gray-400 hover:text-black text-2xl">✕</button>
            </div>
            <div id="ai-content" class="text-lg text-gray-700 leading-relaxed">
                <!-- Content injected here -->
            </div>
            <div class="mt-8 pt-6 border-t border-gray-100 flex justify-end">
                <button onclick="closeAIResponse()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold">Got it!</button>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "";
        const tripData = [

                bg: "https://images.unsplash.com/photo-1508344928928-7165b67de128?auto=format&fit=crop&q=80&w=1200",
                theme: "orange",
                activities: [
                    "🕒 1:10 PM: Tigers Opening Day vs. Cardinals",

            {

                ],
                gf: "Breakfast: Germack Roasting | Lunch: Supino Pizzeria | Dinner: Big Time Eats"
            },
            {
                date: "Sunday, April 5",
                title: "Easter Bunny Hop",
                bg: "https://images.unsplash.com/photo-1522336572018-ed994602f30b?auto=format&fit=crop&q=80&w=1200",
                theme: "pink",
                activities: [
                    "🕒 11:00 AM: Easter Brunch @ JoJo's ShakeBAR",
                    "🕒 7:20 PM: Tigers Kids Day (Face Painting & Ferris Wheel)"
                ],
                gf: "Brunch: JoJo's | Lunch: Anna's House | Dinner: Comerica Park GF Stand"
            },
            {
                date: "Monday, April 6",

                bg: "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&q=80&w=1200",
                theme: "indigo",

            {

                bg: "https://images.unsplash.com/photo-1559599101-f09722fb4948?auto=format&fit=crop&q=80&w=1200",
                theme: "red",
                activities: [

                ],

            {

                theme: "cyan",

                ],
                gf: "Breakfast: Anna's House | Lunch: Playa Bowls | Dinner: Merri Bowl"
            },
            {
                date: "Thursday, April 9",
                title: "Style & Strike",
                bg: "https://images.unsplash.com/photo-1519340333755-968054813588?auto=format&fit=crop&q=80&w=1200",
                theme: "yellow",
                activities: [
                    "🕒 1:00 PM: Somerset Collection Luxury Shopping",
                    "🕒 7:00 PM: Night Strike @ Merri Bowl (Unlimited!)"
                ],
                gf: "Breakfast: Thyme Kitchen | Lunch: The Loose Goose | Dinner: Union Assembly"
            },
            {
                date: "Friday, April 10",
                title: "Underwater Finale",
                bg: "https://images.unsplash.com/photo-1540331547168-8b63109225b7?auto=format&fit=crop&q=80&w=1200",
                theme: "blue",
                activities: [
                    "🕒 10:00 AM: SEA LIFE Aquarium (Auburn Hills)",
                    "🕒 6:45 PM: Party in the Park + Fireworks vs. Marlins"
                ],
                gf: "Breakfast: Rainforest Cafe | Lunch: Rise Pies (GF) | Dinner: Union Assembly"
            }
        ];

        let currentSlide = 0;
        const totalSlides = tripData.length + 1;

        function initSlides() {
            const container = document.getElementById('dynamic-slides-container');
            container.innerHTML = ''; // Clear just in case
            
            tripData.forEach((day, i) => {
                const slide = document.createElement('div');
                slide.id = `slide-${i + 1}`;
                slide.className = 'slide flex-col items-center justify-center bg-cover bg-center';
                slide.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('${day.bg}')`;
                
                slide.innerHTML = `
                    <div class="glass max-w-5xl w-[90%] mx-auto rounded-3xl p-10 shadow-2xl border-l-[12px] border-${day.theme}-600">
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h2 class="text-${day.theme}-700 text-xl font-black uppercase tracking-widest">${day.date}</h2>
                                <h1 class="text-6xl font-black text-gray-900 leading-tight">${day.title}</h1>
                            </div>
                            <button onclick="speakText('${day.title}. ${day.activities.join('. ')}')" class="p-5 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 transition-all shadow-md">🔊</button>
                        </div>
                        <div class="grid md:grid-cols-2 gap-10">
                            <div>
                                <div class="flex items-center justify-between mb-5">
                                    <h3 class="text-2xl font-bold text-gray-800">The Action Plan</h3>
                                    <button onclick="getMagicDetail(${i})" class="text-sm font-bold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-full border border-indigo-200 hover:bg-indigo-100 transition-all">
                                        ✨ Magic Detailer
                                    </button>
                                </div>
                                <ul class="space-y-4">
                                    ${day.activities.map(act => `<li class="flex items-center text-lg text-gray-700 font-medium"><span class="w-2 h-2 bg-${day.theme}-500 rounded-full mr-3"></span>${act}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="bg-${day.theme}-50/50 p-8 rounded-3xl border border-${day.theme}-100">
                                <div class="flex items-center justify-between mb-5">
                                    <h3 class="text-2xl font-bold text-${day.theme}-800">Gluten-Free Fuel</h3>
                                    <button onclick="getMealRec(${i})" class="text-sm font-bold text-green-700 bg-green-50 px-4 py-2 rounded-full border border-green-200 hover:bg-green-100 transition-all">
                                        ✨ Menu Scout
                                    </button>
                                </div>
                                <p class="text-xl text-gray-700 leading-relaxed font-semibold italic">"${day.gf}"</p>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(slide);
            });
            updateIndicator();
        }

        function showSlide(index) {
            if (index < 0) index = totalSlides - 1;
            if (index >= totalSlides) index = 0;

            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(`slide-${index}`);
            if (target) {
                target.classList.add('active');
                currentSlide = index;
                updateIndicator();
            }
        }

        function nextSlide() { showSlide(currentSlide + 1); }
        function prevSlide() { showSlide(currentSlide - 1); }

        function updateIndicator() {
            document.getElementById('slide-indicator').innerText = `Slide ${currentSlide + 1} of ${totalSlides}`;
        }

        // --- GEMINI POWER ---

        async function callGemini(prompt, system) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: system || "Expert guide for a 11-year-old traveler named Lyra." }] }
            };
            try {
                const response = await fetch(url, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'application/json' } });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "Oops, Lyra! I couldn't find that detail. Try again!";
            } catch (e) { return "Error connecting to AI."; }
        }

        async function getMagicDetail(idx) {
            const modal = document.getElementById('ai-response-modal');
            const content = document.getElementById('ai-content');
            document.getElementById('ai-title').innerText = "✨ Magic Detail Finder";
            content.innerHTML = `<div class="p-10 text-center"><div class="loader"></div><p class="mt-4 font-bold text-indigo-600">Digging for hidden gems...</p></div>`;
            modal.classList.remove('hidden');

            const prompt = `Give me one really cool "insider tip" or "hidden secret" for an 11-year-old girl named Lyra for these activities: ${tripData[idx].activities.join(', ')}. Mention a specific thing to look for!`;
            const result = await callGemini(prompt, "You are a fun, excited travel expert who loves helping kids find the 'secret' fun parts of activities. Keep it short but very detailed.");
            content.innerHTML = `<div class="bg-indigo-50 p-6 rounded-2xl border-2 border-indigo-100 text-xl font-medium text-gray-800">${result}</div>`;
        }

        async function getMealRec(idx) {
            const modal = document.getElementById('ai-response-modal');
            const content = document.getElementById('ai-content');
            document.getElementById('ai-title').innerText = "🍕 GF Menu Scout";
            content.innerHTML = `<div class="p-10 text-center"><div class="loader"></div><p class="mt-4 font-bold text-green-600">Finding the yummiest GF dishes...</p></div>`;
            modal.classList.remove('hidden');

            const prompt = `Based on these restaurants: ${tripData[idx].gf}, suggest the absolute best Gluten-Free dish Lyra (age 11) should order at each one. Explain why it's delicious!`;
            const result = await callGemini(prompt, "You are a foodie expert specializing in Gluten-Free dining in Detroit and Windsor. Make the food sound amazing and safe.");
            content.innerHTML = `<div class="bg-green-50 p-6 rounded-2xl border-2 border-green-100 text-xl font-medium text-gray-800">${result}</div>`;
        }

        function closeAIResponse() { document.getElementById('ai-response-modal').classList.add('hidden'); }
        function toggleAIChat() { document.getElementById('ai-chat').classList.toggle('hidden'); }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const history = document.getElementById('chat-history');
            const val = input.value.trim();
            if(!val) return;

            history.innerHTML += `<div class="text-right"><span class="bg-indigo-100 px-4 py-2 rounded-2xl rounded-tr-none inline-block text-gray-800"><b>You:</b> ${val}</span></div>`;
            input.value = '';
            
            const typing = document.createElement('div');
            typing.innerHTML = `<span class="italic text-gray-400">Expert is thinking...</span>`;
            history.appendChild(typing);
            history.scrollTop = history.scrollHeight;

            const res = await callGemini(val, "You are the 'Detroit Expert' guide for Lyra, a detail-oriented 11-year-old. Answer her questions with fun facts, dates, and times from her itinerary if relevant.");
            history.removeChild(typing);
            history.innerHTML += `<div><span class="bg-gray-100 px-4 py-2 rounded-2xl rounded-tl-none inline-block text-gray-800 border border-gray-200"><b>Expert:</b> ${res}</span></div>`;
            history.scrollTop = history.scrollHeight;
        }

        // --- TTS MAGIC ---

        async function speakIntro() {
            speakText("Hi Lyra! I'm so excited for your trip. We have nine action-packed days planned in Detroit and Windsor. Click the buttons to see each day, and use the Magic Detailer to find secrets about each activity!");
        }

        async function speakText(text) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: `Say this in a very excited and friendly voice for an 11 year old girl: ${text}` }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } }
                }
            };
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const result = await response.json();
                const pcmData = result.candidates[0].content.parts[0].inlineData.data;
                const sampleRate = parseInt(result.candidates[0].content.parts[0].inlineData.mimeType.match(/rate=(\d+)/)?.[1] || "24000");
                const audioBlob = pcmToWav(pcmData, sampleRate);
                const audio = new Audio(URL.createObjectURL(audioBlob));
                audio.play();
            } catch (e) { console.error("TTS Error", e); }
        }

        function pcmToWav(base64Pcm, sampleRate) {
            const pcmBuffer = Uint8Array.from(atob(base64Pcm), c => c.charCodeAt(0)).buffer;
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            view.setUint32(0, 0x52494646, false); 
            view.setUint32(4, 36 + pcmBuffer.byteLength, true);
            view.setUint32(8, 0x57415645, false); 
            view.setUint32(12, 0x666d7420, false); 
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); 
            view.setUint16(22, 1, true); 
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            view.setUint32(36, 0x64617461, false); 
            view.setUint32(40, pcmBuffer.byteLength, true);
            return new Blob([wavHeader, pcmBuffer], { type: 'audio/wav' });
        }

        initSlides();
    </script>
</body>
</html>
